<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>

</style>
</head>
<body>
  <div class="g" style="background: var(--brand-gradient)"><span>על הגובה — שחייה, ביטחון והנאה</span></div>

</html>
