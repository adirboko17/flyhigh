<!-- @dsCard group="Colors" viewport="700x150" name="Ink — Neutrals" subtitle="Cool greys. Text, borders, surfaces" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-body); padding: 20px; }
  .scale { display: flex; border: 1px solid var(--ink-100); border-radius: var(--radius-md); overflow: hidden; }
  .sw { flex: 1; height: 84px; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; }
  .sw span { font-size: 10px; font-weight: 600; }
  .meta { margin-top: 10px; font-size: 12px; color: var(--ink-500); display: flex; justify-content: space-between; }
  .meta b { color: var(--ink-800); }
</style>
</head>
<body>
  <div class="scale" id="s"></div>
  <div class="meta"><span>50 (page bg) → 950</span><span><b>900 #1f2433</b> text · <b>500</b> muted · <b>100</b> borders</span></div>
  <script>
    const steps = [50,100,200,300,400,500,600,700,800,900,950];
    document.getElementById('s').innerHTML = steps.map(n => {
      const light = n <= 300;
      return `<div class="sw" style="background:var(--ink-${n})"><span style="color:${light ? '#1f2433' : '#fff'}">${n}</span></div>`;
    }).join('');
  </script>
</body>
</html>
