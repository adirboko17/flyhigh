<!-- @dsCard group="Colors" viewport="700x150" name="Logo Accents" subtitle="Magenta · Cyan · Orange — expressive only" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-body); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .bar { height: 64px; }
  .lab { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
  .name { font-size: 12px; font-weight: 600; color: var(--ink-800); }
  .hex { font-size: 11px; color: var(--ink-400); }
  .note { margin-top: 12px; font-size: 12px; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="bar" style="background:var(--logo-magenta)"></div><div class="lab"><span class="name">Magenta</span><span class="hex">#EC008C</span></div></div>
    <div class="cell"><div class="bar" style="background:var(--logo-cyan)"></div><div class="lab"><span class="name">Cyan</span><span class="hex">#00AEEF</span></div></div>
    <div class="cell"><div class="bar" style="background:var(--logo-orange)"></div><div class="lab"><span class="name">Orange</span><span class="hex">#FBB03B</span></div></div>
  </div>
  <p class="note">Live in the logo only. Use sparingly for playful highlights — never as primary UI chrome (that's brand blue).</p>
</body>
</html>
