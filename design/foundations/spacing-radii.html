<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radii" subtitle="sm 8 · md 14 · lg 20 · xl 28 · full" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .box { width: 92px; height: 92px; background: var(--brand-100); border: 1.5px solid var(--brand-400); }
  .k { font-size: 11px; color: var(--ink-500); margin-top: 8px; }
  .k b { color: var(--ink-800); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="k"><b>sm</b> · 8 · chips</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="k"><b>md</b> · 14 · buttons/inputs</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="k"><b>lg</b> · 20 · cards</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="k"><b>xl</b> · 28 · hero</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-full)"></div><div class="k"><b>full</b> · badges/avatars</div></div>
  </div>
</body>
</html>
