<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--white); font-family: var(--font-display); padding: 24px; color: var(--ink-900); }
  h1 { font-size: 44px; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -0.01em; }
  h2 { font-size: 24px; font-weight: 700; margin: 8px 0 0; color: var(--ink-700); }
  .tag { font-family: var(--font-body); font-size: 12px; color: var(--ink-400); margin-top: 12px; }
</style>
</head>
<body>
  <h1>שחייה, ביטחון והנאה</h1>
  <h2>בגובה העיניים — לכל ילד וילדה</h2>

</body>
</html>
