  .r .k { width: 96px; font-size: 11px; color: var(--ink-400); font-family: monospace; flex-shrink: 0; }

</style>
</head>
<body>
  <div class="r"><span class="k">5xl · 48</span><span class="s" style="font-size:48px">על הגובה</span></div>

  <div class="r"><span class="k">base · 16</span><span class="s" style="font-size:16px;font-weight:400">טקסט גוף ראשי</span></div>
  <div class="r"><span class="k">sm · 14</span><span class="s" style="font-size:14px;font-weight:400">טקסט טבלה וטופס</span></div>

</html>
